# =====================================================================
# Fabrication automatique de l'APPLI ANDROID (fichier APK)
# ---------------------------------------------------------------------
# À chaque modification envoyée sur GitHub (branche main), GitHub :
#   1. installe Capacitor (l'outil qui emballe notre site dans une appli) ;
#   2. copie les fichiers de l'appli web dans le dossier "www" ;
#   3. crée le projet Android, fabrique l'APK ;
#   4. le publie à une adresse fixe :
#      https://github.com/Madix-Sanzeu/Tout-Dans-L-Agenda/releases/download/apk/TDA.apk
#
# Suivre une fabrication : onglet « Actions » du dépôt GitHub.
# Relancer à la main : Actions → « Appli Android (APK) » → « Run workflow ».
# =====================================================================

name: Appli Android (APK)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**']   # les docs et le serveur ne changent pas l'appli
  workflow_dispatch:                          # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write          # pour publier l'APK dans « Releases »

concurrency:
  group: apk
  cancel-in-progress: true # si deux modifications se suivent, seule la dernière est fabriquée

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java (pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # La CLÉ DE SIGNATURE doit rester la même d'une version à l'autre :
      # sinon Android refuse la mise à jour (il faudrait désinstaller l'appli
      # et donc perdre ses tâches). On la garde dans le cache privé de GitHub.
      - name: Retrouver la clé de signature
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tda-cle-signature-v1

      # Clé PERMANENTE : si le secret GitHub ANDROID_KEYSTORE_BASE64 existe
      # (Settings → Secrets and variables → Actions), c'est elle qui signe.
      # Sinon, on utilise la clé gardée dans le cache (ou on en crée une).
      - name: Créer la clé de signature (première fois seulement)
        env:
          CLE_PERMANENTE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$CLE_PERMANENTE" ]; then
            echo "$CLE_PERMANENTE" | base64 -d > ~/.android/debug.keystore
            echo "Signature avec la clé permanente (secret GitHub)"
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TDA,O=TDA,C=FR"
          fi

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Copier l'appli web dans « www »
        run: |
          mkdir -p www
          cp -r index.html aide.html confidentialite.html mentions-legales.html \
                manifest.json icone.svg icone-192.png icone-512.png sw.js css js www/

      - name: Créer le projet Android
        run: npx cap add android

      - name: Réglages Android (rappels, icônes, version)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # Rappels à la minute près : USE_EXACT_ALARM (Android 13+, accordé d'office)
          # et SCHEDULE_EXACT_ALARM pour Android 12.
          sed -i 's#<application#<uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <application#' "$M"
          # Petite icône blanche des notifications
          mkdir -p android/app/src/main/res/drawable
          cp android-ressources/ic_stat_tda.xml android/app/src/main/res/drawable/
          # Icône de l'appli : assets/icon-only.png (anciens Android) et
          # assets/icon-foreground.png + icon-background.png (icône adaptative)
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#f5f3ee' --splashBackgroundColorDark '#12161f' \
            || echo "Icônes : on garde celles par défaut"
          # Numéro de version = numéro de la fabrication (indispensable pour les mises à jour)
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          npx cap sync android

      - name: Fabriquer l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TDA.apk

      - name: Garder une copie dans « Actions »
        uses: actions/upload-artifact@v4
        with:
          name: TDA-apk
          path: TDA.apk

      - name: Publier l'APK (lien de téléchargement fixe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk TDA.apk --target "${{ github.sha }}" --prerelease \
            --title "Appli Android — version 1.${{ github.run_number }}" \
            --notes "Version de test de l'appli Android. Pour l'installer : voir aide.html (« Installer l'appli »)."
